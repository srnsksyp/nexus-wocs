name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Contributor Preflight
    runs-on: ubuntu-latest
    # Placeholder values are sufficient for compiling the app in CI; no live
    # Clerk, Convex, OpenAI, or Firecrawl credentials are used by the checks.
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ZHVtbXktc2VjcmV0LWtleQ==
      NEXT_PUBLIC_CONVEX_URL: https://mock.convex.cloud
      NEXUS_CONVEX_INTERNAL_KEY: ci-only-placeholder-not-a-secret
      OPENAI_API_KEY: sk-proj-ci-placeholder
      FIRECRAWL_API_KEY: fc-ci-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contributor preflight
        run: npm run preflight
